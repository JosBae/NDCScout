[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ndc-scout"
version = "0.1.0"
description = "Find which NDC of a generic drug reimburses best for a pharmacy (Meta Global AI Developer Hackathon, indie track)"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27", "pydantic>=2", "mcp>=2.0,<3", "python-dotenv>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ndc-scout = "ndc_scout.cli:main"

[tool.setuptools]
packages = ["ndc_scout"]

[tool.pytest.ini_options]
testpaths = ["tests"]
